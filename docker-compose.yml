services:
  academy-api:
    build:
      context: ./server/Academy.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
    volumes:
      - ./server/Academy.Api/App_Data:/app/App_Data
      - ./server/Academy.Api/wwwroot/uploads:/app/wwwroot/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  academy-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ACADEMY_API_ORIGIN: http://academy-api:8080
    restart: unless-stopped
    depends_on:
      academy-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
